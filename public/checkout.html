<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Checkout | Private Gateway</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 10px; }
        .amount { font-size: 24px; color: #27ae60; font-weight: bold; margin-bottom: 20px; }
        img { width: 200px; height: 200px; margin-bottom: 15px; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Complete Payment</h2>
        <div id="loading">Generating QR...</div>
        <div id="payment-box" style="display:none;">
            <div class="amount" id="amt-text"></div>
            <img id="qr-img" src="" alt="UPI QR Code">
            <p>Scan with any UPI App (GPay, PhonePe, Paytm)</p>
            <button onclick="checkStatus()">Check Payment Status</button>
            <div class="status" id="status-msg"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || "15";
        const order_id = urlParams.get('order_id') || "ORD_" + Date.now();

        async function loadQR() {
            try {
                const res = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, order_id })
                });
                const data = await res.json();
                document.getElementById('qr-img').src = data.qr_image;
                document.getElementById('amt-text').innerText = `₹ ${data.amount}`;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('payment-box').style.display = 'block';
            } catch (err) {
                document.getElementById('loading').innerText = "Failed to load payment QR.";
            }
        }

        async function checkStatus() {
            document.getElementById('status-msg').innerText = "Checking...";
            const res = await fetch('/api/verify-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount, order_id })
            });
            const data = await res.json();
            if (data.status === "SUCCESS") {
                document.getElementById('status-msg').style.color = "green";
                document.getElementById('status-msg').innerText = "SUCCESS! Payment Verified.";
                setTimeout(() => alert("Payment Successful!"), 500);
            } else {
                document.getElementById('status-msg').style.color = "orange";
                document.getElementById('status-msg').innerText = "Pending... Please complete payment.";
            }
        }

        loadQR();
    </script>
</body>
</html>
