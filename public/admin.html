<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - UPI Gateway</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
        .success { color: green; font-weight: bold; }
        .pending { color: orange; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Dashboard - Transactions</h2>
        <p><strong>UPI ID:</strong> paytm.s2ujlw0@pty</p>
        <p><strong>API Key:</strong> <code>sibaditya_secure_api_key_2026</code></p>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="txTable">
                <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchTransactions() {
            try {
                const res = await fetch('/api/admin/transactions');
                const data = await res.json();
                if(data.success) {
                    const tbody = document.getElementById('txTable');
                    tbody.innerHTML = '';
                    data.payments.forEach(tx => {
                        tbody.innerHTML += `<tr>
                            <td>${tx.orderId}</td>
                            <td>₹${tx.amount}</td>
                            <td class="${tx.status.toLowerCase()}">${tx.status}</td>
                            <td>${new Date(tx.createdAt).toLocaleString()}</td>
                        </tr>`;
                    });
                }
            } catch(e) { console.error(e); }
        }
        fetchTransactions();
        setInterval(fetchTransactions, 5000);
    </script>
</body>
</html>
