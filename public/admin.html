<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Private Gateway</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .box { background: #2a2a40; padding: 20px; border-radius: 8px; flex: 1; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: #2a2a40; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        th { background: #3a3a5c; }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Private Gateway Admin Dashboard</h1>
        <div class="stats">
            <div class="box"><h3>Total Orders</h3><p id="total-ord">0</p></div>
            <div class="box"><h3>Success</h3><p id="succ-ord" style="color: #2ecc71;">0</p></div>
            <div class="box"><h3>Pending</h3><p id="pend-ord" style="color: #f1c40f;">0</p></div>
        </div>

        <h2>Recent Transactions</h2>
        <table>
            <thead>
                <tr><th>Order ID</th><th>Amount</th><th>Status</th><th>Webhook URL</th><th>Time</th></tr>
            </thead>
            <tbody id="tx-table"></tbody>
        </table>

        <h2>Webhooks Logs</h2>
        <table>
            <thead>
                <tr><th>Order ID</th><th>Amount</th><th>Status</th><th>Trigger Time</th></tr>
            </thead>
            <tbody id="wh-table"></tbody>
        </table>
    </div>

    <script>
        async function fetchStats() {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();
            document.getElementById('total-ord').innerText = data.total;
            document.getElementById('succ-ord').innerText = data.success;
            document.getElementById('pend-ord').innerText = data.pending;

            let txHtml = '';
            data.transactions.forEach(t => {
                txHtml += `<tr><td>${t.order_id}</td><td>₹${t.amount}</td><td style="color:${t.status==='SUCCESS'?'#2ecc71':'#f1c40f'}">${t.status}</td><td>${t.webhook_url}</td><td>${t.created_at}</td></tr>`;
            });
            document.getElementById('tx-table').innerHTML = txHtml;

            let whHtml = '';
            data.webhooks.forEach(w => {
                whHtml += `<tr><td>${w.order_id}</td><td>₹${w.amount}</td><td style="color:#2ecc71">${w.status}</td><td>${w.time}</td></tr>`;
            });
            document.getElementById('wh-table').innerHTML = whHtml;
        }
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
