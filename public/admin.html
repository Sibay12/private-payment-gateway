<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tekna Technologies</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: var(--primary-dark);
        }
        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .metric-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border-left: 4px solid var(--primary);
        }
        .metric-card.success { border-left-color: var(--success); }
        .metric-card.pending { border-left-color: var(--warning); }
        .metric-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }
        .metric-value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 5px;
            color: var(--text-main);
        }
        /* Table Section */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .table-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h3 {
            margin: 0;
            font-size: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        th {
            background: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background: #f8fafc;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .badge-pending { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>🛡️ Admin Dashboard <span style="font-size: 12px; background: #e0e7ff; color: var(--primary); padding: 4px 8px; border-radius: 6px;">Live Gateway</span></h1>
            <button class="btn" onclick="loadTransactions()">🔄 Refresh Data</button>
        </header>

        <!-- Metrics Cards -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Total Transactions</div>
                <div class="metric-value" id="totalCount">0</div>
            </div>
            <div class="metric-card success">
                <div class="metric-title">Successful Payments</div>
                <div class="metric-value" id="successCount">0</div>
            </div>
            <div class="metric-card pending">
                <div class="metric-title">Pending Payments</div>
                <div class="metric-value" id="pendingCount">0</div>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="table-container">
            <div class="table-header">
                <h3>Recent Transactions</h3>
                <span style="font-size: 13px; color: var(--text-muted);" id="lastUpdated">Updating...</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="transactionTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted);">Loading transactions...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="footer">
            Created by Sibaditya Pal from <a href="https://www.tekna.online" target="_blank">Tekna Technologies</a>
        </div>
    </div>

    <script>
        function loadTransactions() {
            fetch('/api/admin/transactions')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const payments = data.payments;
                    let total = payments.length;
                    let success = payments.filter(p => p.status === 'SUCCESS').length;
                    let pending = payments.filter(p => p.status === 'PENDING').length;

                    document.getElementById('totalCount').innerText = total;
                    document.getElementById('successCount').innerText = success;
                    document.getElementById('pendingCount').innerText = pending;
                    document.getElementById('lastUpdated').innerText = `Last synced: ${new Date().toLocaleTimeString()}`;

                    const tbody = document.getElementById('transactionTableBody');
                    if (payments.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No transactions found.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = '';
                    payments.forEach(tx => {
                        const dateStr = new Date(tx.createdAt).toLocaleString();
                        const badgeClass = tx.status === 'SUCCESS' ? 'badge-success' : 'badge-pending';
                        
                        const row = `
                            <tr>
                                <td style="font-weight: 600; font-family: monospace;">${tx.orderId}</td>
                                <td style="font-weight: 700; color: #0f172a;">₹${tx.amount}</td>
                                <td><span class="status-badge ${badgeClass}">${tx.status}</span></td>
                                <td style="color: var(--text-muted); font-size: 13px;">${dateStr}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                }
            })
            .catch(err => {
                console.error('Error loading admin data:', err);
            });
        }

        // Load on start & auto-refresh every 10 seconds
        loadTransactions();
        setInterval(loadTransactions, 10000);
    </script>
</body>
</html>
