<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/favicon.png"><link rel="apple-touch-icon" href="/assets/favicon.png"><meta name="theme-color" content="#26338a"><script src="/loader.js" data-manual></script>
<meta name="robots" content="noindex">
<title>Pay securely - TaknaPay.in</title>
<style>
:root{--navy:#26338a;--navy-d:#141c55;--navy-l:#eef0fb;--green:#4fae55;--green-d:#3b9442;--green-l:#e9f6ea;--ink:#101a3a;--mu:#5d6b8c;--line:#e4e8f3;--er:#d93025;--ok:#0f9d58}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(700px 400px at 90% -10%,#dfe4ff 0,transparent 60%),radial-gradient(600px 360px at -5% 100%,#e3f5e4 0,transparent 55%),#f6f8fc;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:440px;background:#fff;border-radius:20px;box-shadow:0 30px 60px -24px rgba(38,51,138,.4);overflow:hidden}
.hd{background:linear-gradient(135deg,var(--navy),#3b4fc4);color:#fff;padding:22px 24px}
.hd small{opacity:.75;font-size:12.5px;display:block}.hd b{font-size:18px;display:block;margin-top:2px}
.bd{padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:21px;letter-spacing:-.4px}.desc{margin:-6px 0 0;color:var(--mu);font-size:14.5px}
.amt{background:var(--navy-l);border-radius:14px;padding:14px 16px;text-align:center}.amt small{color:var(--mu);font-weight:600;font-size:12.5px;display:block}.amt b{font-size:32px;letter-spacing:-1px}
label{font-size:13px;font-weight:700;display:grid;gap:5px}label small{font-weight:400;color:var(--mu)}
input{border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;width:100%}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(38,51,138,.15)}
.btn{border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--green);color:#fff;width:100%;display:block;text-align:center;text-decoration:none}
.btn:hover{background:var(--green-d)}.btn[disabled]{opacity:.6;cursor:wait}
.msg{font-size:13.5px;font-weight:600;color:var(--er);min-height:18px;text-align:center}
.sec{display:flex;gap:8px;justify-content:center;color:var(--mu);font-size:12.5px}
.res{text-align:center;padding:8px 0}.res .ic{font-size:50px}.res h2{margin:6px 0}.res p{margin:0;color:var(--mu)}
.foot{margin-top:16px;font-size:12px;color:var(--mu);display:flex;align-items:center;gap:8px}.foot img{height:22px}
.foot a{color:var(--navy);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="hd"><small>Pay to</small><b id="owner">...</b></div>
  <div class="bd" id="bd"><p style="color:var(--mu);text-align:center;margin:20px 0">Loading...</p></div>
</div>
<div class="foot">Powered by <a href="/"><img src="/assets/logo.png" alt="TaknaPay.in" style="vertical-align:middle"></a></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var slug = (location.pathname.match(/\/l\/([a-z0-9]+)/i) || [])[1] || '';
  var q = new URLSearchParams(location.search), orderId = q.get('orderId');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function inr(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function done() { if (window.GWLoader) GWLoader.hide(); }
  function result(ic, t, p, link) { $('bd').innerHTML = '<div class="res"><div class="ic">' + ic + '</div><h2>' + esc(t) + '</h2><p>' + esc(p) + '</p></div>' + (link ? '<a class="btn" href="/l/' + esc(slug) + '">' + esc(link) + '</a>' : ''); }

  fetch('/api/plink/' + encodeURIComponent(slug), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.success) { $('owner').textContent = 'TaknaPay.in'; result('⚠️', 'Link not found', d.message || 'This payment link does not exist.'); return; }
    $('owner').textContent = d.owner || 'TaknaPay.in'; document.title = 'Pay ' + (d.owner || '') + ' - ' + d.title;

    if (orderId) { // returning from checkout: confirm with the server
      return fetch('/api/check-status/' + encodeURIComponent(orderId), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
        if (s.success && s.status === 'SUCCESS') result('✅', 'Payment successful', inr(s.amount) + ' paid to ' + (d.owner || 'the receiver') + '. Thank you!');
        else result('⏳', 'Payment not confirmed yet', 'If you have already paid, it will be confirmed automatically within a minute.', 'Back to payment');
      }).catch(function () { result('⚠️', 'Could not check', 'Please try again in a moment.', 'Back to payment'); });
    }
    if (!d.active) { result('⏸️', 'Link not accepting payments', 'This payment link is paused. Please contact ' + (d.owner || 'the receiver') + '.'); return; }

    var fixed = d.amount != null;
    $('bd').innerHTML = '<h1>' + esc(d.title) + '</h1>' + (d.description ? '<p class="desc">' + esc(d.description) + '</p>' : '') +
      '<form id="f" style="display:grid;gap:14px">' +
      (fixed ? '<div class="amt"><small>Amount payable</small><b>' + inr(d.amount) + '</b></div>' : '<label>Amount (₹)<input id="a" type="number" min="1" max="500000" step="0.01" inputmode="decimal" required placeholder="Enter amount"></label>') +
      '<label>Your name <small>(optional)</small><input id="n" type="text" maxlength="60" autocomplete="name"></label>' +
      '<label>Mobile or email <small>(optional)</small><input id="c" type="text" maxlength="80" autocomplete="email"></label>' +
      '<button class="btn" id="b" type="submit">' + (fixed ? 'Pay ' + inr(d.amount) : 'Continue to pay') + ' securely</button><div class="msg" id="m" role="alert"></div></form>' +
      '<div class="sec">🔒 UPI · GPay · PhonePe · Paytm · BHIM</div>';
    $('f').onsubmit = function (e) {
      e.preventDefault(); var b = $('b'); b.disabled = true; $('m').textContent = '';
      fetch('/api/plink/' + encodeURIComponent(slug) + '/pay', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount: fixed ? undefined : $('a').value, name: $('n').value, contact: $('c').value }) })
        .then(function (r) { return r.json(); })
        .then(function (p) { if (!p.success) { $('m').textContent = p.message || 'Could not start the payment.'; b.disabled = false; return; } location.href = p.checkoutUrl; })
        .catch(function () { $('m').textContent = 'Network error. Please try again.'; b.disabled = false; });
    };
  }).catch(function () { result('⚠️', 'Could not load', 'Please check your internet and try again.'); }).then(done);
})();
</script>
</body>
</html>
