<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment cancelled - Takna Technology</title>
<link rel="stylesheet" href="/gateway.css">
<script src="/gateway.js"></script>
</head>
<body>
<div class="shell result">
  <div class="main">
    <svg class="ring er" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36"/><path d="M30 30l24 24M54 30L30 54"/></svg>
    <h2 id="title">Payment cancelled</h2>
    <p class="sub" id="sub">No money has been taken. If you already paid, the order will be confirmed automatically.</p>
    <div class="rows" id="rows" style="display:none">
      <div><span>Order ID</span><b id="oid"></b></div>
      <div><span>Status</span><b>Not paid</b></div>
    </div>
    <div class="stack">
      <a id="retry" class="btn pri" href="#" style="display:none">Try payment again</a>
      <a id="back" class="btn out" href="#" style="display:none">Return to merchant</a>
    </div>
    <div class="foot">Powered by <a href="https://www.takna.online" target="_blank" rel="noopener">Takna Technology</a></div>
  </div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var orderId = q.get('orderId'), redirectUrl = q.get('redirectUrl');
  var $ = function (id) { return document.getElementById(id); };
  if (q.get('reason') === 'failed') { $('title').textContent = 'Payment failed'; $('sub').textContent = 'This payment could not be completed. No money has been taken.'; }
  if (!orderId) return;
  $('oid').textContent = orderId; $('rows').style.display = '';

  // Only offer "try again" if the order is still open (not already paid)
  fetch('/api/order/' + encodeURIComponent(orderId), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.success) return;
      if (d.status === 'SUCCESS') {
        location.replace('/success.html?orderId=' + encodeURIComponent(orderId) + (redirectUrl ? '&redirectUrl=' + encodeURIComponent(redirectUrl) : ''));
        return;
      }
      if (d.status === 'PENDING') {
        var r = $('retry'); r.href = '/index.html?orderId=' + encodeURIComponent(orderId) + (redirectUrl ? '&redirectUrl=' + encodeURIComponent(redirectUrl) : ''); r.style.display = 'flex';
      }
      var t = GW.redirectTarget(redirectUrl, orderId, 'CANCELLED', d.redirectHost || null);
      if (t) { var b = $('back'); b.href = t; b.style.display = 'flex'; }
    }).catch(function () {});
})();
</script>
</body>
</html>
