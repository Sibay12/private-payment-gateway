<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/favicon.png"><link rel="apple-touch-icon" href="/assets/favicon.png"><meta name="theme-color" content="#2b3a8c"><script src="/loader.js" data-manual></script>
<title>Pay securely - TaknaPay.in</title>
<link rel="stylesheet" href="/gateway.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="side">
    <a class="logocard" href="https://taknapay.in" target="_blank" rel="noopener" aria-label="TaknaPay.in"><img src="/assets/logo.png" alt="TaknaPay.in" width="595" height="271"></a>
    <div class="payto"><span class="av" id="logo">T</span><div><small>Paying to</small><b id="merchantName">TaknaPay.in</b></div></div>
    <div class="amt"><small>Amount payable</small><b id="amount">₹0.00</b></div>
    <div class="meta"><i>Order ID</i><span id="orderText">Loading...</span></div>
    <div class="secure"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure checkout. Payments are verified automatically</div>
  </aside>

  <section class="main" id="main">
    <h2>Pay using UPI</h2>
    <p class="sub">Scan the QR code with any UPI app</p>
    <div class="qr"><img id="qr" alt="UPI QR code" width="184" height="184"></div>
    <p class="hint">GPay, PhonePe, Paytm, BHIM or any bank app</p>

    <div class="stack">
      <a id="upiBtn" class="btn pri" href="#" style="display:none">Pay with UPI app</a>
      <button id="checkBtn" class="btn out" type="button">Check payment status</button>
    </div>

    <div class="status wait" id="status" role="status" aria-live="polite"><video class="spinv" id="spin" data-gwv muted loop autoplay playsinline aria-hidden="true"></video><span id="statusText">Waiting for your payment</span></div>

    <button id="cancelBtn" class="link" type="button" style="margin-top:12px">Cancel payment</button>

    <div class="foot">Powered by <a href="https://taknapay.in" target="_blank" rel="noopener">TaknaPay.in</a></div>
  </section>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var orderId = q.get('orderId');
  var redirectUrl = q.get('redirectUrl');
  var $ = function (id) { return document.getElementById(id); };
  var timer = null, done = false;

  function carry() { // keep orderId + redirectUrl when moving between gateway pages
    var p = new URLSearchParams({ orderId: orderId });
    if (redirectUrl) p.set('redirectUrl', redirectUrl);
    return p.toString();
  }
  function setStatus(cls, text, spin) {
    $('status').className = 'status ' + cls;
    $('statusText').textContent = text;
    $('spin').style.display = spin ? '' : 'none';
  }
  function fail(msg) {
    $('shell').innerHTML = '<div class="result" style="padding:34px 28px"><h2>Something went wrong</h2><p class="sub"></p></div>';
    document.querySelector('.sub').textContent = msg;
  }
  function success() {
    if (done) return; done = true;
    clearInterval(timer);
    setStatus('ok', 'Payment received', false);
    setTimeout(function () { location.href = '/success.html?' + carry(); }, 700);
  }
  function check(manual) {
    var btn = $('checkBtn');
    if (manual) { btn.disabled = true; btn.textContent = 'Checking...'; setStatus('wait', 'Checking with your bank...', true); }
    return fetch('/api/check-status/' + encodeURIComponent(orderId), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.success && d.status === 'SUCCESS') { success(); return; }
        if (d.success && d.status === 'FAILED') { location.href = '/cancel.html?' + carry() + '&reason=failed'; return; }
        if (manual) setStatus('wait', 'Payment not received yet. Complete it in your UPI app, then check again.', false);
        else setStatus('wait', 'Waiting for your payment', true);
      })
      .catch(function () { if (manual) setStatus('er', 'Could not check right now. Try again.', false); })
      .then(function () { if (manual && !done) { btn.disabled = false; btn.textContent = 'Check payment status'; } });
  }

  if (!orderId) { fail('This payment link is not valid.'); if (window.GWLoader) GWLoader.hide(); return; }
  $('orderText').textContent = orderId;

  fetch('/api/order/' + encodeURIComponent(orderId), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.success) { fail(d.message || 'Order not found.'); return; }
      if (d.merchantName) { $('merchantName').textContent = d.merchantName; $('logo').textContent = (d.merchantName.trim().charAt(0) || 'T').toUpperCase(); document.title = 'Pay ' + d.merchantName + ' - TaknaPay.in'; }
      $('amount').textContent = '₹' + Number(d.amount).toFixed(2);
      $('qr').src = d.qrCodeUrl;
      $('upiBtn').href = d.upiLink;
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) $('upiBtn').style.display = 'flex';
      if (d.status === 'SUCCESS') { success(); return; }
      if (d.status === 'FAILED') { location.href = '/cancel.html?' + carry() + '&reason=failed'; return; }
      timer = setInterval(function () { if (!document.hidden) check(false); }, 4000);
    })
    .catch(function () { fail('Could not load the payment. Please try again.'); })
    .then(function () { if (window.GWLoader) GWLoader.hide(); });

  $('checkBtn').onclick = function () { check(true); };
  $('cancelBtn').onclick = function () {
    if (confirm('Cancel this payment?')) { clearInterval(timer); location.href = '/cancel.html?' + carry(); }
  };
})();
</script>
</body>
</html>
