<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure UPI Checkout - Tekna Technologies</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }
        .checkout-card {
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .badge-secure {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ecfdf5;
            color: #065f46;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid #a7f3d0;
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: var(--text-main);
        }
        .order-id {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .amount-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .amount-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .amount-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }
        .qr-container {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        #qrCode {
            width: 190px;
            height: 190px;
            display: block;
        }
        .instruction {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .app-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .upi-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        .upi-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .status-box {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status-pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }
        .status-success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #b45309;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer-credit {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            font-size: 11px;
            color: var(--text-muted);
        }
        .footer-credit a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-credit a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <!-- Security Badge -->
        <div class="badge-secure">
            🔒 256-Bit Secure Encrypted Checkout
        </div>

        <h2>Secure UPI Payment</h2>
        <div class="order-id" id="orderIdText">Loading Order...</div>

        <div class="amount-box">
            <div class="amount-label">Total Payable Amount</div>
            <div class="amount-value" id="displayAmount">₹0.00</div>
        </div>

        <div>
            <div class="qr-container">
                <img id="qrCode" src="" alt="UPI QR Code">
            </div>
        </div>

        <div class="instruction">Scan QR with any UPI App or click below to pay instantly:</div>

        <!-- Direct UPI App Button -->
        <div class="app-buttons" id="appButtonsContainer" style="display:none;">
            <a id="upiIntentBtn" href="#" class="upi-btn">⚡ Pay via UPI App</a>
        </div>

        <!-- Status Box -->
        <div class="status-box status-pending" id="paymentStatusBox">
            <div class="spinner" id="statusSpinner"></div>
            <span id="paymentStatusText">Waiting for payment...</span>
        </div>

        <!-- Footer Branding -->
        <div class="footer-credit">
            Created by Sibaditya Pal from <a href="https://www.tekna.online" target="_blank">Tekna Technologies</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');

        if (!orderId || !amount) {
            document.querySelector('.checkout-card').innerHTML = '<h3 style="color:red;">Error</h3><p>Invalid or missing payment parameters.</p>';
        } else {
            document.getElementById('orderIdText').innerHTML = `Order ID: <b>${orderId}</b>`;
            document.getElementById('displayAmount').innerHTML = `₹${Number(amount).toFixed(2)}`;

            // Create Payment & Get QR
            fetch('/api/create-payment', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': 'sibaditya_secure_api_key_2026'
                },
                body: JSON.stringify({ amount: Number(amount), orderId: orderId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('qrCode').src = data.qrCodeUrl;
                    
                    // UPI Intent link
                    const upiString = `upi://pay?pa=paytm.s2ujlw0@pty&pn=TeknaTechnologies&am=${amount}&tr=${orderId}&cu=INR`;
                    const upiBtn = document.getElementById('upiIntentBtn');
                    upiBtn.href = upiString;
                    document.getElementById('appButtonsContainer').style.display = 'flex';
                }
            });

            // Poll Status Every 4 seconds
            const checkInterval = setInterval(() => {
                fetch(`/api/check-status/${orderId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.status === 'SUCCESS') {
                        const statusBox = document.getElementById('paymentStatusBox');
                        statusBox.className = 'status-box status-success';
                        document.getElementById('statusSpinner').style.display = 'none';
                        document.getElementById('paymentStatusText').innerHTML = '✅ Payment Successful! Verified.';
                        clearInterval(checkInterval);
                        
                        setTimeout(() => {
                            // Optional redirection or success action
                        }, 2000);
                    }
                });
            }, 4000);
        }
    </script>
</body>
</html>
